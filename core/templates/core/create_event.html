
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create College Event | Campus Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8);
            color: #1f2937;
            min-height: 100vh;
            padding: 40px 16px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4338ca;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: 2px solid #818cf8;
            border-color: #6366f1;
        }

        .submit-button, .back-button {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        .submit-button {
            background: #4f46e5;
            color: white;
        }

        .submit-button:hover {
            background: #3730a3;
        }

        .back-button {
            background: #f3f4f6;
            color: #374151;
        }

        .messages {
            padding: 12px;
            background: #fff7ed;
            border-radius: 8px;
            color: #9a3412;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>🎉 Create College Event</h1>
        <p class="subtitle">
            Share upcoming college activities with students.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="messages">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="title">Event Name</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Annual Day"
                required
            >

            <label for="description">Event Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Enter event details"
                required
            ></textarea>

            <label for="event_date">Event Date and Time</label>
            <input
                type="datetime-local"
                id="event_date"
                name="event_date"
                required
            >

            <label for="venue">Venue</label>
            <input
                type="text"
                id="venue"
                name="venue"
                placeholder="e.g. College Auditorium"
                required
            >

            <button type="submit" class="submit-button">
                Publish Event
            </button>
        </form>

        <a href="{% url 'faculty_dashboard' %}" class="back-button">
            ← Back to Dashboard
        </a>
    </main>
</body>
</html>
