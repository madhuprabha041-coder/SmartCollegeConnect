
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Activity | Campus Hub</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 30px 15px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0b1026;
            color: white;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: #171e3a;
            border: 1px solid #52608a66;
            border-radius: 18px;
        }
        h1 { color: #75eaff; }
        label {
            display: block;
            margin: 18px 0 8px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #52608a;
            border-radius: 8px;
            background: #0b1026;
            color: white;
            font-size: 15px;
        }
        textarea { min-height: 110px; }
        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(100deg, #913dff, #e33ec9);
            color: white;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .back { background: #087eaf; }
        .messages { color: #7cffc4; margin-top: 15px; }
    </style>
</head>
<body>
    <main class="container">
        <h1>🎯 Submit Student Activity</h1>
        <p>Share your workshops, hackathons, competitions, and achievements.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="messages">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="title">Activity Title</label>
            <input id="title" name="title" required
                   placeholder="e.g. National Coding Hackathon">

            <label for="description">Description</label>
            <textarea id="description" name="description" required
                      placeholder="Describe your participation"></textarea>

            <label for="activity_type">Activity Type</label>
            <select id="activity_type" name="activity_type" required>
                <option value="">Select activity type</option>
                <option value="workshop">Workshop</option>
                <option value="hackathon">Hackathon</option>
                <option value="competition">Competition</option>
                <option value="cultural">Cultural Activity</option>
                <option value="sports">Sports</option>
                <option value="other">Other</option>
            </select>

            <label for="activity_date">Activity Date</label>
            <input id="activity_date" name="activity_date"
                   type="date" required>

            <button type="submit">Submit Activity</button>
        </form>

        <br>
        <a class="back" href="{% url 'student_dashboard' %}">
            ← Back to Dashboard
        </a>
    </main>
</body>
</html>
