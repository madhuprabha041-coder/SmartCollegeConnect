
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish Announcement | Campus Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 16px;
            background: radial-gradient(circle at top left, #692bba55, transparent 40%), #0b1026;
            color: white;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 35px;
            border-radius: 20px;
            background: #171e3a;
            border: 1px solid #9180ff55;
            box-shadow: 0 0 35px #913dff22;
        }

        h1 {
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ff71d5, #54eaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .description {
            color: #c0cbea;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #52608a;
            border-radius: 9px;
            background: #0e1530;
            color: white;
            font-size: 16px;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        button {
            margin-top: 22px;
            padding: 14px 22px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(100deg, #913dff, #e33ec9);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .messages {
            margin-bottom: 15px;
            color: #7cffc4;
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            color: #70eaff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📢 Publish Announcement</h1>
        <p class="description">
            Share important college updates with your students.
        </p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="title">Announcement Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Example: College reopens on Monday"
                required
            >

            <label for="message">Announcement Details</label>
            <textarea
                id="message"
                name="message"
                placeholder="Enter the announcement details..."
                required
            ></textarea>

            <button type="submit">Publish Announcement →</button>
        </form>

        <a class="back" href="{% url 'faculty_dashboard' %}">
            ← Back to Faculty Dashboard
        </a>
    </div>
</body>
</html>
