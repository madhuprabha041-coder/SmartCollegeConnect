

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | Campus Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(ellipse at 15% 20%, #18275c 0%, transparent 40%),
                radial-gradient(ellipse at 85% 75%, #40164f 0%, transparent 38%),
                #080b18;
            color: white;
            text-align: center;
        }

        .card {
            width: min(90%, 450px);
            padding: 40px 28px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(112, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.15);
        }

        h1 {
            color: #70f3ff;
            margin-bottom: 15px;
        }

        p {
            color: #b8c4e4;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin: 12px 5px 0;
            padding: 13px 22px;
            border-radius: 9px;
            background: linear-gradient(100deg, #65efff, #a79aff);
            color: #080b18;
            font-weight: bold;
            text-decoration: none;
        }

        .home {
            background: transparent;
            border: 1px solid #8a8fff;
            color: white;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>You are logged out!</h1>

        <p>
            Your Campus Hub session has ended.
            Please log in again whenever you want to access your account.
        </p>

        <a href="/login/" class="button">Login Again</a>
        <a href="/" class="button home">Back to Home</a>
    </div>
</body>
</html>
